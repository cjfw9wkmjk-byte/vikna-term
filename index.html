<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vikna Term Company</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #18212b;
}

.card {
  width: 100%;
  max-width: 560px;
  background: white;
  border-radius: 22px;
  padding: 42px 34px;
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
  text-align: center;
}

.logo {
  width: 72px;
  height: 72px;
  margin: 0 auto 22px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #18212b;
  color: white;
  font-size: 25px;
  font-weight: bold;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  margin: 10px 0 32px;
  color: #68727d;
  font-size: 15px;
}

.details {
  text-align: left;
  border-top: 1px solid #e8ebee;
}

.item {
  padding: 18px 4px;
  border-bottom: 1px solid #e8ebee;
}

.label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: bold;
  color: #8a939c;
  text-transform: uppercase;
  letter-spacing: .8px;
}

.value {
  color: #18212b;
  font-size: 16px;
  line-height: 1.5;
  text-decoration: none;
  word-break: break-word;
}

.footer {
  margin-top: 26px;
  font-size: 12px;
  color: #9aa2aa;
}
</style>
</head>

<body>

<main class="card">

<div class="logo">VT</div>

<div class="subtitle">

</div>

</div>

</div>
